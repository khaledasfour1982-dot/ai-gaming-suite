spring:
  application:
    name: restaurant-management
  datasource:
    url: jdbc:postgresql://localhost:5443/postgres
    username: user
    password: password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:8180/realms/keepdishesgoing/protocol/openid-connect/certs
          issuer-uri: http://localhost:8180/realms/keepdishesgoing
  rabbitmq:
    host: localhost
    port: 5672
    username: user
    password: password

server:
  port: 8080



logging:
  level:
    # see routing keys, exchanges, confirms/returns
    org.springframework.amqp: DEBUG
    org.springframework.rabbit: DEBUG
    org.springframework.amqp.rabbit.core.RabbitTemplate: TRACE
    # spring modulith event externalization logs
    org.springframework.modulith: DEBUG
    org.springframework.modulith.events: DEBUG

