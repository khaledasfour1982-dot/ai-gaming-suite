stages:
  - test
  - deploy

test_game_engine:
  stage: test
  image: python:3.12
  before_script:
    - apt-get update -qq && apt-get install -y docker.io
    - pip install --user --upgrade pip
    - pip install --user -r requirements.txt
  script:
    - python -m pytest game_engine/tests/ -v --junitxml=pytest.xml
  rules:
    - when: on_success
  artifacts:
    reports:
      junit: pytest.xml
    paths:
      - pytest.xml
    expire_in: 1 week
    when: always
  cache:
    paths:
      - ~/.cache/pip


deploy_game_engine:
  stage: deploy
  image: docker:27
  services:
    - docker:27-dind
  script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker build -f game_engine/Dockerfile -t "$CI_REGISTRY_IMAGE/game-engine:$CI_COMMIT_SHORT_SHA" .
    - docker push "$CI_REGISTRY_IMAGE/game-engine:$CI_COMMIT_SHORT_SHA"
    - docker tag "$CI_REGISTRY_IMAGE/game-engine:$CI_COMMIT_SHORT_SHA" "$CI_REGISTRY_IMAGE/game-engine:latest"
    - docker push "$CI_REGISTRY_IMAGE/game-engine:latest"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: on_success

